name: Comment on PR (Generated Docs)

on:
  workflow_run:
    workflows: ["Check Generated Docs Freshness"]
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    runs-on: codebuild-stellaraf-actions-public-${{ github.run_id }}-${{ github.run_attempt }}
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download PR metadata
        env:
          S3_SOURCE: s3://stellaraf-public-ci-961341522852-us-west-1/actions/${{ github.repository }}/${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }}/${{ github.event.workflow_run.head_sha }}/docs-check-pr/pr-number
        run: |
          aws s3 cp "$S3_SOURCE" pr-number --only-show-errors
          python3 - <<'PYVALIDATE'
          import json, os, pathlib
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          expected = {str(p["number"]) for p in event["workflow_run"]["pull_requests"] if p["base"]["repo"]["id"] == event["repository"]["id"]}
          actual = pathlib.Path("pr-number").read_text().strip()
          assert actual.isdecimal() and actual in expected, "Artifact PR does not match trusted workflow metadata"
          PYVALIDATE

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(fs.readFileSync('pr-number', 'utf8').trim(), 10);
            if (isNaN(prNumber)) {
              core.setFailed('Invalid PR number');
              return;
            }

            const marker = '<!-- generated-docs-check -->';
            const body = marker + '\nThe `docs/generated/` folder is out of date but I was unable to push the fix automatically.\n\nPlease run the following and commit the result:\n\n```\nmake generate-docs\n```';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
